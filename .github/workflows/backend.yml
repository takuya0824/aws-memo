name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  # PR では変更の場所に関係なく毎回テストする（test を必須チェックにしているため。
  # paths で絞ると、backend を触らない PR で test が報告されずマージできなくなる）
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: pytest backend/tests/ -v
        working-directory: .

  deploy:
    needs: test
    # PR ではテストだけ行い、デプロイしない。手動実行でも main 以外はデプロイしない
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t ${{ secrets.ECR_URI }}:${{ github.sha }} \
            -t ${{ secrets.ECR_URI }}:latest \
            --push \
            ./backend

      - name: Force ECS redeployment
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --force-new-deployment \
            --region ap-northeast-1

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE }} \
            --region ap-northeast-1
